<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷题练习</title>
<meta name="theme-color" content="#fafafa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#222;--sub:#888;--line:#e8e8e8;--acc:#111;--ok:#2e7d32;--bad:#c62828;--okbg:#eaf5eb;--badbg:#fbecec}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:64px}
.topbar{position:sticky;top:0;background:var(--bg);z-index:10;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;font-weight:600}
.topbar .row{display:flex;align-items:center;gap:10px}
.topbar .back{background:none;border:none;font-size:20px;color:var(--fg);cursor:pointer;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 16px}
h2{font-size:16px;font-weight:600;margin:16px 16px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;user-select:none}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.link{color:var(--fg);text-decoration:none}
.muted{color:var(--sub);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statnum{font-size:26px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;margin:3px 4px 3px 0;cursor:pointer;background:var(--card)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* 答题 */
.qstem{font-size:16px;font-weight:500;margin:10px 0 14px;white-space:pre-wrap}
.qimg{width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff}
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;cursor:pointer;background:var(--card)}
.opt .tag{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.opt.sel{border-color:var(--acc)}
.opt.sel .tag{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .tag{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .tag{background:var(--bad);color:#fff;border-color:var(--bad)}
.opttext{flex:1;white-space:pre-wrap}
.expl{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:12px 14px;margin:14px 0;background:var(--card);font-size:14px;white-space:pre-wrap}
.qnav{display:flex;gap:10px;margin:16px}
.qnav .btn{flex:1}
.pill{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-right:6px}
.answerline{margin:12px 16px;font-size:15px}
/* 列表行 */
.row-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.row-item .arrow{margin-left:auto;color:var(--sub)}
.tag-ok{color:var(--ok)}.tag-bad{color:var(--bad)}
/* 底部导航 */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--sub);text-decoration:none}
.nav a.on{color:var(--acc);font-weight:600}
.nav .ic{display:block;font-size:19px;line-height:1.2}
/* 模拟考 */
.timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;margin:10px 0}
.cardgrid .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--card)}
.cardgrid .cell.done{background:var(--acc);color:#fff;border-color:var(--acc)}
.cardgrid .cell.flag{border-color:var(--bad);color:var(--bad)}
.cardgrid .cell.cur{outline:2px solid var(--acc);outline-offset:1px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:12px}
.overlay img{max-width:100%;max-height:100%}
.sect{font-size:13px;color:var(--sub);margin:18px 16px 2px;text-transform:none}
.prog{display:flex;gap:3px;height:5px;margin:8px 0}
.prog>i{flex:1;background:var(--line);border-radius:2px}
.prog>i.ok{background:var(--ok)}.prog>i.bad{background:var(--bad)}
textarea,input[type=number],input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--card);color:var(--fg)}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini td{padding:5px 2px;border-bottom:1px solid var(--line)}
table.mini td:last-child{text-align:right;color:var(--sub)}
/* 手写板 */
.fab{position:fixed;right:14px;bottom:78px;width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.3);z-index:60;cursor:pointer;user-select:none}
#pad{position:fixed;z-index:120;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.2);display:none;flex-direction:column;overflow:hidden}
#pad.on{display:flex}
#pad .ph{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f5f5f5;border-bottom:1px solid var(--line);font-size:13px;cursor:move;user-select:none;touch-action:none;-webkit-user-select:none}
#pad .ph b{font-weight:600}
#pad .ph button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--fg)}
#pad canvas{flex:1;display:block;background:#fff;touch-action:none;cursor:crosshair}
#pad .grip{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;z-index:2;background:linear-gradient(135deg,transparent 50%,#bbb 50%);border-top-left-radius:4px;touch-action:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav"></nav>
<script>
"use strict";
const LOGIN_PWD = "jwz2026"; // 入口密码：改这里（注：静态页的门槛密码，防路过的访客，防不了看源码）
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem("jwz_" + k)); return v == null ? d : v; } catch { return d; } },
  set(k, v) { localStorage.setItem("jwz_" + k, JSON.stringify(v)); }
};

// ---------- 数据 ----------
let INDEX = null;                       // data/index.json
const CHAP_CACHE = {};                  // chapterId -> questions[]
const POOL = {};                        // subjectId -> 题池（开始考试/随机练习用，单文件）
async function loadIndex() {
  if (!INDEX) INDEX = await (await fetch("data/index.json")).json();
  return INDEX;
}
async function loadChapter(id) {
  if (!CHAP_CACHE[id]) {
    const meta = findChapter(id);
    CHAP_CACHE[id] = (await (await fetch(meta.file)).json()).questions;
  }
  return CHAP_CACHE[id];
}
function findChapter(id) {
  for (const s of INDEX.subjects) for (const sec of s.sections) for (const c of sec.chapters)
    if (c.id === id) return { ...c, subjectId: s.id, subjectName: s.name, sectionName: sec.name };
  return null;
}
function subjectChapters(sid) {
  const out = [];
  for (const s of INDEX.subjects) if (s.id === sid) for (const sec of s.sections)
    for (const c of sec.chapters) out.push({ ...c, sectionName: sec.name });
  return out;
}

// ---------- 记录 ----------
// rec: {qid:{n:做题数,c:答对数}}  wrong:{qid:{count}}  fav:[qid]  stats:{date:{n,c}}
function bump(qid, correct) {
  const rec = Store.get("rec", {});
  const r = rec[qid] || (rec[qid] = { n: 0, c: 0 });
  r.n++; if (correct) r.c++;
  Store.set("rec", rec);
  const today = new Date().toISOString().slice(0, 10);
  const st = Store.get("stats", {});
  const d = st[today] || (st[today] = { n: 0, c: 0 });
  d.n++; if (correct) d.c++;
  Store.set("stats", st);
  const wrong = Store.get("wrong", {});
  if (!correct) { const w = wrong[qid] || (wrong[qid] = { count: 0 }); w.count++; Store.set("wrong", wrong); }
  else if (wrong[qid]) { delete wrong[qid]; Store.set("wrong", wrong); }
}

// ---------- 视图 ----------
const state = { view: "home", q: null };
const NAV = [["home","首页","⌂"],["catalog","练习","✎"],["wrong","错题","⚑"],["stats","统计","▤"],["me","我","☰"]];
function render() {
  // 入口登录门（auth 标志存 localStorage）
  if (!Store.get("auth", false)) {
    $("#nav").innerHTML = "";
    $("#topbar").innerHTML = `<div class="row"><h1>刷题练习</h1></div>`;
    $("#main").innerHTML = `
      <div class="card" style="margin-top:40px">
        <div style="text-align:center;margin-bottom:14px"><div style="font-size:17px;font-weight:600">刷题练习</div>
        <div class="muted">公共科目 · 数学1</div></div>
        <input type="password" id="pwd" placeholder="访问密码" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')login()">
        <div id="pwderr" style="color:var(--bad);text-align:center;font-size:13px;min-height:22px;padding-top:6px"></div>
        <button class="btn block" onclick="login()">登录</button>
      </div>`;
    const p = document.getElementById("pwd");
    if (p) p.focus();
    return;
  }
  // nav
  $("#nav").innerHTML = NAV.map(([v,t,ic]) =>
    `<a href="#" class="${state.view===v||(v==="catalog"&&["quiz","mock","report","catalog2"].includes(state.view))?"on":""}" onclick="go('${v}')"><span class="ic">${ic}</span>${t}</a>`).join("");
  ({ home, catalog, catalog2, quiz, wrong, stats, me, mock, report, quizMock, links, hotspot, exams, kp })[state.view](state.arg);
  window.scrollTo(0, 0);
}
function login() {
  const v = document.getElementById("pwd").value;
  if (v === LOGIN_PWD) { Store.set("auth", true); state.view = "home"; render(); }
  else document.getElementById("pwderr").textContent = "密码不对";
}
function logout() { Store.set("auth", false); render(); }

// ===== 手写板（数学1/岗位能力做题页显示入口；可拖动、右下角调大小、清空）=====
const PAD = { open: false, x: 16, y: 110, w: 320, h: 260, strokes: [], cur: null };
function needScratch(qid) {
  try {
    const c = findChapter(String(qid).split("#")[0]);
    return !!c && (c.subjectName === "数学1" || c.subjectName === "408" || c.subjectName === "行测" || c.subjectName === "申论" || c.sectionName.indexOf("岗位能力") === 0);
  } catch (e) { return false; }
}
function togglePad() {
  PAD.open = !PAD.open;
  if (PAD.open) { padInit(); document.getElementById("pad").classList.add("on"); padPlace(); }
  else document.getElementById("pad").classList.remove("on");
}
function padClear() { PAD.strokes = []; redrawPad(); }
function padInit() {
  if (document.getElementById("pad")) return;
  const el = document.createElement("div");
  el.id = "pad";
  el.innerHTML = `<div class="ph" id="padH"><b>手写板</b><span style="flex:1"></span>
    <button onclick="padClear()">清空</button><button onclick="togglePad()">×</button></div>
    <canvas id="padC"></canvas><div class="grip" id="padG"></div>`;
  document.body.appendChild(el);
  const c = document.getElementById("padC");
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", e => {
    c.setPointerCapture(e.pointerId);
    PAD.cur = [pos(e)];
    PAD.strokes.push(PAD.cur);
    const ctx = c.getContext("2d");
    ctx.beginPath(); ctx.moveTo(PAD.cur[0][0], PAD.cur[0][1]); ctx.lineTo(PAD.cur[0][0] + .01, PAD.cur[0][1] + .01); ctx.stroke();
    e.preventDefault();
  });
  c.addEventListener("pointermove", e => {
    if (!PAD.cur) return;
    const p = pos(e), last = PAD.cur[PAD.cur.length - 1];
    PAD.cur.push(p);
    const ctx = c.getContext("2d");
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
  });
  ["pointerup", "pointercancel"].forEach(t => c.addEventListener(t, () => { PAD.cur = null; }));
  // 标题栏拖动
  const h = document.getElementById("padH");
  let drag = null;
  h.addEventListener("pointerdown", e => {
    if (e.target.tagName === "BUTTON") return;
    drag = { x: e.clientX - PAD.x, y: e.clientY - PAD.y };
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener("pointermove", e => {
    if (!drag) return;
    PAD.x = e.clientX - drag.x; PAD.y = e.clientY - drag.y;
    padPlace();
  });
  h.addEventListener("pointerup", () => { drag = null; });
  // 右下角调大小
  const g = document.getElementById("padG");
  let rs = null;
  g.addEventListener("pointerdown", e => {
    rs = { x: e.clientX, y: e.clientY, w: PAD.w, h: PAD.h };
    g.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  });
  g.addEventListener("pointermove", e => {
    if (!rs) return;
    PAD.w = Math.max(180, Math.min(innerWidth - 8, rs.w + e.clientX - rs.x));
    PAD.h = Math.max(140, Math.min(innerHeight - 8, rs.h + e.clientY - rs.y));
    padPlace();
  });
  g.addEventListener("pointerup", () => { rs = null; });
}
function padPlace() {
  const el = document.getElementById("pad");
  if (!el) return;
  PAD.x = Math.max(0, Math.min(PAD.x, innerWidth - PAD.w));
  PAD.y = Math.max(0, Math.min(PAD.y, innerHeight - PAD.h));
  el.style.left = PAD.x + "px"; el.style.top = PAD.y + "px";
  el.style.width = PAD.w + "px"; el.style.height = PAD.h + "px";
  padCanvasSize();
}
function padCanvasSize() {
  const c = document.getElementById("padC");
  if (!c || !c.clientWidth) return;
  const dpr = devicePixelRatio || 1;
  c.width = Math.round(c.clientWidth * dpr);
  c.height = Math.round(c.clientHeight * dpr);
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#111";
  redrawPad();
}
function redrawPad() {
  const c = document.getElementById("padC");
  if (!c || !c.width) return;
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.lineWidth = 2.5; ctx.strokeStyle = "#111";
  for (const s of PAD.strokes) {
    if (!s.length) continue;
    if (s.length === 1) {
      ctx.beginPath(); ctx.arc(s[0][0], s[0][1], 1.5, 0, 7); ctx.fillStyle = "#111"; ctx.fill();
      continue;
    }
    ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
    ctx.stroke();
  }
}
// 图片预取：当前题解析图 + 下一题整题，消除切换等待
function prefetchQ(q) {
  if (!q) return;
  [].concat(q.img || [], q.expl_img || []).forEach(src => {
    if (src) { const i = new Image(); i.src = src; }
  });
}
function go(view, arg) { state.view = view; state.arg = arg; render(); }

function header(title, back) {
  $("#topbar").innerHTML = `<div class="row">${back ? `<button class="back" onclick="go('${back}')">‹</button>` : ""}<h1>${esc(title)}</h1></div>`;
}

// 首页
async function home() {
  await loadIndex();
  header("刷题练习");
  const st = Store.get("stats", {});
  const today = st[new Date().toISOString().slice(0, 10)] || { n: 0, c: 0 };
  const rec = Store.get("rec", {});
  const wrong = Store.get("wrong", {});
  const totalN = Object.values(rec).reduce((a, r) => a + r.n, 0);
  const totalC = Object.values(rec).reduce((a, r) => a + r.c, 0);
  // 连续天数
  let streak = 0;
  for (let i = 0; ; i++) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    if (st[d] && st[d].n > 0) streak++; else if (i > 0) break; else if (!st[d]) break;
  }
  const last = Store.get("last", null);
  let html = "";
  // ① 考试倒计时条（置顶，点击进考试中心——即「考试中心」按钮的入口）
  try {
    const exd = await (await fetch("data/exams.json")).json();
    const t0 = new Date(new Date().toDateString());
    const upcoming = (exd.exams || []).filter(e => !e.done && e.exam_iso)
      .map(e => ({ e, days: Math.ceil((new Date(e.exam_iso + "T00:00:00") - t0) / 86400000) }))
      .filter(x => x.days >= 0)
      .sort((a, b) => a.days - b.days)[0];
    if (upcoming) {
      html += `<div class="card" style="cursor:pointer;display:flex;gap:12px;align-items:center" onclick="go('exams')">
        <div class="statnum" style="color:${upcoming.days <= 14 ? "var(--bad)" : "var(--fg)"}">D-${upcoming.days}</div>
        <div style="flex:1"><div><b>${esc(upcoming.e.name)}</b></div>
        <div class="muted">${esc(upcoming.e.exam_text || "")} · 报名入口与全部考试 →</div></div></div>`;
    }
  } catch (e) { /* 倒计时失败不影响首页其余内容 */ }
  // ② 统计单行
  html += `<div class="card" style="display:flex;justify-content:space-between;text-align:center;padding:12px 6px">
    <div><div style="font-weight:600;font-size:19px">${today.n}</div><div class="muted" style="font-size:12px">今日做题</div></div>
    <div><div style="font-weight:600;font-size:19px">${streak}</div><div class="muted" style="font-size:12px">连续天</div></div>
    <div><div style="font-weight:600;font-size:19px">${totalN}</div><div class="muted" style="font-size:12px">累计做题</div></div>
    <div><div style="font-weight:600;font-size:19px">${totalN ? Math.round(totalC / totalN * 100) : 0}%</div><div class="muted" style="font-size:12px">总正确率</div></div>
  </div>`;
  // ③ 继续上次
  if (last && last.qid) {
    html += `<div class="card" style="cursor:pointer" onclick="resumeLast()"><b>继续上次练习</b><div class="muted">${esc(last.label || "")} ${last.idx + 1}/${last.total}</div></div>`;
  }
  // ④ 功能入口合并一张卡（考试中心由顶部倒计时条承担，不再单列）
  html += `<div class="card"><div class="grid2">
    <button class="btn ghost" onclick="go('hotspot')">时政热点 · 每日更新</button>
    <button class="btn ghost" onclick="go('links')">408 备考资料</button>
    <button class="btn ghost" style="grid-column:1/-1" onclick="go('kp')">知识点 · 背诵</button>
    <button class="btn ghost" onclick="go('wrong')">错题本 ${Object.keys(wrong).length}</button>
    <button class="btn" onclick="go('mock')">模拟考试</button>
  </div></div>`;
  // ⑤ 分科板块（按考试分组，软考高级→中级排序）
  const EXAM_GROUPS = [
    ["军队文职", ["公共科目", "数学1"]],
    ["考研", ["408"]],
    ["公务员", ["行测", "申论"]],
    ["法考", ["法律"]],
    ["软考", ["系统架构设计师", "系统分析师", "信息系统项目管理师", "软件设计师", "信息安全工程师"]],
  ];
  html += `<div class="sect">分科练习 · 点击进入章节</div><div class="card">`;
  for (const [gname, ids] of EXAM_GROUPS) {
    html += `<div class="muted" style="font-size:13px;margin:8px 0 2px">${gname}</div><div style="display:flex;flex-wrap:wrap">`;
    for (const id of ids) {
      const s = INDEX.subjects.find(x => x.id === id);
      if (!s) continue;
      const n = subjectChapters(s.id).length;
      html += `<span class="chip" onclick="go('catalog2','${id}')">${esc(s.name)}<span class="muted" style="margin-left:4px">${n}章</span></span>`;

function CHAPTER_STATS(cid, rec) {
  const qs = CHAP_CACHE[cid];
  if (!qs) return null;
  let n = 0, c = 0;
  for (const q of qs) { const r = rec[q.id]; if (r) { n += r.n; c += r.c; } }
  return n ? { n, pct: Math.round(c / n * 100) } : null;
}

async function startRandom(n) {
  try {
    await loadIndex();
    const sid = state.arg || INDEX.subjects[0].id;
    // ponytail: 题池单文件加载（旧版串行拉全部310个章节=13.3MB导致卡死）
    if (!POOL[sid]) {
      const subj = INDEX.subjects.find(s => s.id === sid);
      POOL[sid] = (await (await fetch(`data/pool/${(subj && subj.code) || sid}.json`)).json()).questions;
    }

    const qs = shuffle([...POOL[sid]]).slice(0, n);
    startQuiz("random", qs, `随机练习·${INDEX.subjects.find(s => s.id === sid).name}`);
  } catch (e) {
    alert("题库加载失败，请重试：" + e.message);
  }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz(mode, qs, label, extra = {}) {
  state.q = { mode, qs, label, idx: 0, judged: {}, picked: {}, flags: new Set(), start: Date.now(), ...extra };
  if (mode === "chapter" && extra.chapterId) {
    const last = Store.get("last", null);
    if (last && last.chapterId === extra.chapterId && last.idx < qs.length - 1) state.q.idx = last.idx;
  }
  go("quiz");
}

function quiz() {
  const Q = state.q;
  if (!Q) return go("home");
  const q = Q.qs[Q.idx];
  const judged = Q.judged[q.id];
  const isMulti = q.type === "multi";
  const isSubj = q.type === "subjective" || !(q.options && q.options.length);
  const picked = Q.picked[q.id] || (isMulti ? [] : null);
  header(Q.label, Q.mode === "wrong" ? "wrong" : (Q.mode === "random" ? "catalog" : "catalog2"));
  $("#topbar").innerHTML += `<div class="prog">${Q.qs.map((x, i) => `<i class="${Q.judged[x.id] ? (Q.judged[x.id].correct ? "ok" : "bad") : ""}"></i>`).join("")}</div>`;

  const tags = [`<span class="pill">${Q.idx + 1} / ${Q.qs.length}</span>`,
    `<span class="pill">${isSubj ? "主观题" : isMulti ? "多选" : "单选"}</span>`];
  let html = `<div class="card">`;
  html += tags.join("");
  if (q.img) {
    html += `<div class="qstem">${esc(q.stem || "")}</div>${imgHTML(q.img, "题目图片")}`;
  } else {
    html += `<div class="qstem">${esc(q.stem)}</div>`;
  }
  if (isSubj) {
    // 主观题（申论）：阅读材料 → 查看参考答案 → 自评（接入统计/错题本）
    if (judged) {
      html += `<div class="answerline"><b class="${judged.correct ? "tag-ok" : "tag-bad"}">${judged.correct ? "✓ 已掌握" : "✗ 未掌握"}</b> · <span class="muted">自评已计入统计与错题本</span></div>`;
      if (q.explanation) html += `<div class="expl"><b>机构参考答案</b>\n${esc(q.explanation)}</div>`;
      if (q.expl_img) html += imgHTML(q.expl_img, "参考答案图片");
    } else if (Q.showAns && Q.showAns[q.id]) {
      if (q.explanation) html += `<div class="expl"><b>机构参考答案</b>\n${esc(q.explanation)}</div>`;
      if (q.expl_img) html += imgHTML(q.expl_img, "参考答案图片");
      html += `<div class="grid2" style="margin-top:12px">
        <button class="btn ghost" onclick="subjJudge(true)">✓ 已掌握</button>
        <button class="btn" onclick="subjJudge(false)">✗ 未掌握</button></div>`;
    } else {
      html += `<div class="muted" style="margin-top:8px">读完给定资料与作答要求，自己先动笔作答，再看参考答案自评。</div>`;
      html += `<button class="btn block" onclick="showAnswer()" style="margin-top:10px">查看参考答案</button>`;
    }
  } else {
    const letters = ["A","B","C","D","E","F"];
    q.options.forEach((o, i) => {
      const L = letters[i];
      const isRight = q.answer.includes(L);
      let cls = "opt";
      if (judged) cls += isRight ? " ok" : (picked.includes?.(L) || picked === L ? " bad" : "");
      else if (isMulti ? picked.includes(L) : picked === L) cls += " sel";
      html += `<div class="${cls}" onclick="pick('${q.id}',${i})">
        <div class="tag">${L}</div>
        <div class="opttext">${q.img && q.textOptions ? esc(o) : esc(o)}</div></div>`;
    });
    if (judged) {
      html += `<div class="answerline"><b class="${judged.correct ? "tag-ok" : "tag-bad"}">${judged.correct ? "✓ 回答正确" : "✗ 回答错误"}</b> · 正确答案：<b>${esc(q.answer)}</b></div>`;
      if (q.explanation) html += `<div class="expl"><b>解析</b>\n${esc(q.explanation)}</div>`;
      if (q.expl_img) html += imgHTML(q.expl_img, "解析图片");
    } else if (isMulti) {
      html += `<button class="btn block" onclick="judge('${q.id}')" style="margin-top:8px">确认答案</button>`;
    }
  }
  html += `</div>`;
  html += `<div class="qnav">
    <button class="btn ghost" onclick="moveQ(-1)" ${Q.idx === 0 ? "disabled" : ""}>上一题</button>
    <button class="btn ghost" onclick="toggleFav('${q.id}')">${isFav(q.id) ? "★ 已收藏" : "☆ 收藏"}</button>
    <button class="btn" onclick="moveQ(1)">${Q.idx === Q.qs.length - 1 ? (Q.mode === "wrong" ? "完成" : "完成") : "下一题"}</button>
  </div>`;
  if (needScratch(q.id)) html += `<div class="fab" onclick="togglePad()" title="手写板">✎</div>`;
  $("#main").innerHTML = html;
  prefetchQ(q);            // 当前题解析图提前拉
  prefetchQ(Q.qs[Q.idx + 1]); // 下一题整题提前拉

  // 继续上次
  if (Q.mode === "chapter") {
    const last = { qid: q.id, idx: Q.idx, total: Q.qs.length, chapterId: Q.chapterId, label: Q.label };
    Store.set("last", last);
  }
}
function isFav(id) { return Store.get("fav", []).includes(id); }
function toggleFav(id) {
  let fav = Store.get("fav", []);
  fav = fav.includes(id) ? fav.filter(x => x !== id) : [...fav, id];
  Store.set("fav", fav); render();
}
function resumeLast() {
  const last = Store.get("last", null);
  if (last && last.chapterId) startChapter(last.chapterId);
}
function pick(qid, i) {
  const Q = state.q, q = Q.qs[Q.idx];
  if (Q.judged[qid]) return;
  const L = "ABCDEF"[i];
  if (q.type === "multi") {
    const arr = Q.picked[qid] || [];
    Q.picked[qid] = arr.includes(L) ? arr.filter(x => x !== L) : [...arr, L];
    render();
  } else {
    Q.picked[qid] = L;
    judge(qid);
  }
}
function judge(qid) {
  const Q = state.q, q = Q.qs.find(x => x.id === qid);
  const picked = Q.picked[qid];
  if (!picked || (q.type === "multi" && !picked.length)) return;
  const correct = q.type === "multi"
    ? [...picked].sort().join("") === [...q.answer].sort().join("")
    : picked === q.answer;
  Q.judged[qid] = { correct, picked };
  bump(qid, correct);
  render();
}
function moveQ(d) {
  const Q = state.q;
  if (Q.idx + d >= Q.qs.length) return finishQuiz();
  Q.idx = Math.max(0, Q.idx + d);
  render();
}
// 主观题（申论）
function showAnswer() {
  const Q = state.q;
  (Q.showAns = Q.showAns || {})[Q.qs[Q.idx].id] = true;
  render();
}
function subjJudge(ok) {
  const Q = state.q;
  const q = Q.qs[Q.idx];
  Q.judged[q.id] = { correct: !!ok, self: true };
  bump(q.id, !!ok);
  render();
}
function finishQuiz() {
  const Q = state.q;
  const n = Object.keys(Q.judged).length;
  const c = Object.values(Q.judged).filter(j => j.correct).length;
  alert(`完成！共做 ${n} 题，答对 ${c} 题，正确率 ${n ? Math.round(c / n * 100) : 0}%`);
  Store.set("last", null);
  go(Q.mode === "wrong" ? "wrong" : "home");
}
function zoom(src) {

}

// 统计
function stats() {
  header("学习统计");
  const rec = Store.get("rec", {});
  const st = Store.get("stats", {});
  let n = 0, c = 0;
  for (const r of Object.values(rec)) { n += r.n; c += r.c; }
  // 近 7 日
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    days.push([d.slice(5), st[d]?.n || 0]);
  }
  const maxN = Math.max(1, ...days.map(x => x[1]));
  let html = `<div class="card"><div class="grid2">
    <div><div class="statnum">${n}</div><div class="muted">累计做题</div></div>
    <div><div class="statnum">${n ? Math.round(c / n * 100) : 0}%</div><div class="muted">总正确率</div></div>
  </div>
  <div class="muted" style="margin-top:12px">近 7 日做题量</div>
  <div style="display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px">
    ${days.map(([d, v]) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="width:100%;background:var(--acc);border-radius:4px 4px 0 0;height:${Math.round(v / maxN * 64)}px"></div>
      <span class="muted" style="font-size:10px">${d}</span></div>`).join("")}
  </div></div>`;
  // 章节掌握度
  html += `<h2>章节掌握度</h2><div class="card">`;
  const rows = [];
  if (INDEX) for (const s of INDEX.subjects) for (const cid of subjectChapters(s.id).map(c => c.id)) {
    const arr = CHAP_CACHE[cid];
    if (!arr) continue;
    let cn = 0, cc = 0;
    for (const q of arr) { const r = rec[q.id]; if (r) { cn += r.n; cc += r.c; } }
    if (cn) rows.push([findChapter(cid).name, Math.round(cc / cn * 100), cn]);
  }
  rows.sort((a, b) => a[1] - b[1]);
  html += rows.length ? rows.map(([name, pct, cn]) =>
    `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${esc(name)}</span><span class="muted">${pct}%（${cn}题）</span></div>
     <div class="bar"><i style="width:${pct}%"></i></div></div>`).join("")
    : `<div class="muted">做题后这里会显示各章正确率。</div>`;
  html += `</div>`;
  $("#main").innerHTML = html;
}

function submitMock() {
  const Q = state.q;

  if (unanswered && !confirm(`还有 ${unanswered} 题未作答，确定交卷？`)) return;
  let c = 0;
  for (const q of Q.qs) {

      ? (p && [...p].sort().join("") === [...q.answer].sort().join(""))
      : p === q.answer;

  mocks.unshift({ date: new Date().toISOString().slice(0, 10), label: Q.label, total: Q.qs.length, correct: c, timeUsed: Math.round((Date.now() - Q.start) / 1000) });

// 文件名英文化后的进度迁移：localStorage 中旧 qid/章节ID → 新 ID（data/idmap.json）
async function migrateIds() {
  let map = null;
  try {
    const r = await fetch("data/idmap.json");
    if (r.ok) map = await r.json();
  } catch (e) { return; }
  if (!map || !Object.keys(map).length) return;
  const remap = (q) => {
    q = String(q);
    const i = q.indexOf("#");
    if (i < 0) return map[q] || q;
    const cid = q.slice(0, i);
    return (map[cid] || cid) + q.slice(i);
  };
  const rec = Store.get("rec", {}); const rec2 = {};
  for (const k of Object.keys(rec)) {
    const nk = remap(k);
    if (rec2[nk]) { rec2[nk].n += rec[k].n; rec2[nk].c += rec[k].c; }
    else rec2[nk] = rec[k];
  }
  Store.set("rec", rec2);
  const wrong = Store.get("wrong", {}); const w2 = {};
  for (const k of Object.keys(wrong)) {
    const nk = remap(k);
    w2[nk] = w2[nk] ? { count: Math.max(w2[nk].count, wrong[k].count) } : wrong[k];
  }
  Store.set("wrong", w2);
  const fav = Store.get("fav", []);
  Store.set("fav", [...new Set(fav.map(remap))]);
  const last = Store.get("last", null);
  if (last) {
    const l = { ...last };
    if (l.qid) l.qid = remap(l.qid);
    if (l.chapterId && map[l.chapterId]) l.chapterId = map[l.chapterId];
    Store.set("last", l);
  }
}

// 带超时的 fetch（外网源挂起时 8s 中止走回退链，绝不永久卡住）
async function fetchTO(url, opts = {}, ms = 8000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r;
  } finally { clearTimeout(t); }
}

}

// md 迷你渲染器（标题/表格/列表/引用/加粗/分隔线）
function md2html(src) {
  const inl = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = src.split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,4}\s/.test(l)) {
      const lv = Math.min(5, l.match(/^#+/)[0].length + 1);
      html += `<h${lv} style="margin:12px 0 6px;font-size:${17 - lv}px;font-weight:600">${inl(l.replace(/^#+\s*/, ""))}</h${lv}>`;
      i++; continue;
    }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        const cells = lines[i].replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        if (!/^-{2,}/.test(cells[0])) rows.push(cells);
        i++;
      }
      if (rows.length) {
        html += `<table class="mini" style="width:100%;border-collapse:collapse;font-size:13px;margin:8px 0"><tr>` +
          rows[0].map(c => `<th style="border:1px solid var(--line);padding:5px 7px;text-align:left;background:#f5f5f5">${inl(c)}</th>`).join("") + `</tr>` +
          rows.slice(1).map(r => "<tr>" + r.map(c => `<td style="border:1px solid var(--line);padding:5px 7px;vertical-align:top">${inl(c)}</td>`).join("") + "</tr>").join("") + `</table>`;
      }
      continue;
    }
    if (/^---+\s*$/.test(l)) { html += `<hr style="border:none;border-top:1px solid var(--line);margin:10px 0">`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      html += `<ul style="margin:6px 0 6px 20px">` + items.map(x => `<li>${inl(x)}</li>`).join("") + `</ul>`;
      continue;
    }
    if (/^>\s?/.test(l)) {
      const qs = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { qs.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += `<div class="muted" style="border-left:3px solid var(--line);padding-left:8px;margin:6px 0">${inl(qs.join(" "))}</div>`;
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||>|---+|\s*[-*]\s)/.test(lines[i])) { para.push(inl(lines[i])); i++; }
    html += `<p style="margin:6px 0">${para.join("<br>")}</p>`;
  }
  return html;
}
// 每日日报 HTML → {date, groups:[{title, items:[{title,date,url}]}]}
function parseReport(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const date = (doc.querySelector("h1") || {}).textContent || "";
  const groups = [];
  for (const h2 of doc.querySelectorAll("section h2")) {
    const sec = h2.closest("section");
    if (!sec) continue;
    const items = [];
    for (const h3 of sec.querySelectorAll("h3")) {
      const tag = h3.querySelector(".tag");
      const d = tag ? tag.textContent.trim() : "";
      let title = h3.textContent.replace(d, "").trim();
      const card = h3.parentElement;
      const a = (card && card.querySelector("p.src a")) || h3.nextElementSibling;
      const url = a && a.href ? a.href : "";
      if (title) items.push({ title, date: d, url });
    }
    if (items.length) groups.push({ title: h2.textContent.trim(), items });
  }
  return { date: date.trim(), groups };
}

    $("#main").innerHTML = html;
    return;
  }
  if (S.stage === "c") {
    const g = subj.groups[S.g];
    const cards = g.cards;
    if (S.c >= cards.length) {
      const st = kpGroupStat(subj.name, cards, g.name);
      $("#main").innerHTML = `<div class="card" style="text-align:center">
        <div class="statnum">${st.known}/${st.total}</div><div class="muted">本组熟悉 · 已评 ${st.done} 张</div>
        <div class="grid2" style="margin-top:14px">
          <button class="btn ghost" onclick="kpRestart()">重背本组</button>
          <button class="btn" onclick="kpBack('g')">返回分组</button></div></div>`;
      return;
    }
    const card = cards[S.c];
    const lvl = kpGet(subj.name, g.name, card.q);
    let html = `<div class="topbar" style="position:static;border:none;padding:0 16px"><div class="row" style="padding:10px 0">
      <button class="back" onclick="kpBack('g')">‹</button>
      <div style="flex:1;font-size:13px" class="muted">${esc(subj.name)} · ${esc(g.name)}</div>
      <span class="pill">${S.c + 1} / ${cards.length}</span></div></div>`;
    html += `<div class="card" onclick="kpFlip()" style="cursor:pointer;min-height:150px">`;
    if (!S.show) {
      html += `<div style="text-align:center;padding:26px 6px">
        <div style="font-size:17px;font-weight:600;line-height:1.6">${esc(card.q)}</div>
        <div class="muted" style="margin-top:26px">点击卡片翻面看答案 ↻</div></div>`;
    } else {
      html += `<div class="muted" style="font-size:13px;margin-bottom:6px">考点：</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:10px">${esc(card.q)}</div>
        <div class="expl" style="margin:0">${esc(card.a || "（无详解）")}</div>`;
    }
    html += `</div>`;
    if (S.show) {
      html += `<div class="card"><div style="display:flex;gap:8px">
        <button class="btn ghost" style="flex:1" onclick="kpJudge(1)">✗ 不认识</button>
        <button class="btn ghost" style="flex:1" onclick="kpJudge(2)">~ 模糊</button>
        <button class="btn" style="flex:1" onclick="kpJudge(3)">✓ 认识</button></div>
        ${lvl ? `<div class="muted" style="text-align:center;margin-top:8px">上次自评：${["", "不认识", "模糊", "认识"][lvl]}</div>` : ""}</div>`;
    }
    html += `<div class="qnav">
      <button class="btn ghost" onclick="kpMove(-1)" ${S.c === 0 ? "disabled" : ""}>上一张</button>
      <button class="btn" onclick="kpMove(1)">下一张 →</button></div>`;
    $("#main").innerHTML = html;
    return;
  }
}
function kpPickSubj(i) { kpSt.s = i; kpSt.stage = "g"; renderKp(); }
function kpPickGroup(i) { kpSt.g = i; kpSt.c = 0; kpSt.show = false; kpSt.stage = "c"; renderKp(); }
function kpBack(stage) { kpSt.stage = stage; kpSt.show = false; renderKp(); }
function kpFlip() { kpSt.show = !kpSt.show; renderKp(); }
function kpMove(d) {
  const g = KPDATA.subjects[kpSt.s].groups[kpSt.g];
  kpSt.c = Math.max(0, Math.min(g.cards.length, kpSt.c + d));
  kpSt.show = false;
  renderKp();
}
function kpJudge(lvl) {
  const subj = KPDATA.subjects[kpSt.s];
  const g = subj.groups[kpSt.g];
  kpSet(subj.name, g.name, g.cards[kpSt.c].q, lvl);
  kpMove(1);
}
function kpRestart() { kpSt.c = 0; kpSt.show = false; renderKp(); }

// ===== 考试中心（倒计时 + 报名入口，数据源 data/exams.json 可自行维护）=====
async function exams() {
  header("考试中心", "home");
  $("#main").innerHTML = `<div class="card muted">📅 正在加载考试日程…</div>`;
  let data;
  try { data = await (await fetch("data/exams.json")).json(); }
  catch (e) { data = { exams: [], note: "加载失败：" + e.message }; }
  if (state.view !== "exams") return;
  const t0 = new Date(new Date().toDateString());
  const dayDiff = (iso) => Math.ceil((new Date(iso + "T00:00:00") - t0) / 86400000);
  const list = [...(data.exams || [])].sort((a, b) =>
    (a.done ? 1 : 0) - (b.done ? 1 : 0) ||
    String(a.exam_iso || "9999").localeCompare(String(b.exam_iso || "9999")));
  let html = `<div class="card muted" style="margin-bottom:0">📅 ${esc(data.note || "以官方公告为准")}</div>`;
  for (const e of list) {
    const days = e.exam_iso ? dayDiff(e.exam_iso) : null;
    let badge;
    if (e.done) badge = `<span class="pill">已考完</span>`;
    else if (days != null && days >= 0) badge = `<div class="statnum" style="font-size:24px;color:${days <= 14 ? "var(--bad)" : "var(--fg)"}">D-${days}</div>`;
    else badge = `<span class="pill">已结束</span>`;
    html += `<div class="card">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        ${badge}
        <div style="flex:1;min-width:150px"><b>${esc(e.name)}</b>${e.est ? ' <span class="pill">预估</span>' : ""}
          <div class="muted" style="font-size:13px">${esc(e.group || "")}</div></div>
      </div>
      <div class="muted" style="margin-top:8px;font-size:13px">笔试：${esc(e.exam_text || "待公告")}<br>报名：${esc(e.reg_text || "待公告")}</div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn ghost" onclick="window.open('${esc(e.reg_url)}','_blank','noopener')">报名入口 ↗</button>
        <button class="btn ghost" onclick="window.open('${esc(e.site_url)}','_blank','noopener')">官方网站 ↗</button>
      </div>
    </div>`;
  }
  $("#main").innerHTML = html;
}
// 启动：idmap 迁移（文件名英文化后旧做题进度自动换新 ID），再渲染
(async () => { try { await migrateIds(); } catch (e) {} render(); })();

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
